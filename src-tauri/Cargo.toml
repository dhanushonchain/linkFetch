[package]
name = "linkfetch"
version = "0.1.0"
description = "Minimal native macOS link downloader"
authors = ["linkFetch"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "linkfetch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "process",
  "io-util",
  "fs",
  "time",
  "sync",
] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "stream",
  "charset",
  "http2",
] }
futures-util = "0.3"
url = "2"
percent-encoding = "2"
scraper = "0.27"
readability = "0.3"
mime_guess = "2"

[dev-dependencies]
httpmock = "0.8"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
